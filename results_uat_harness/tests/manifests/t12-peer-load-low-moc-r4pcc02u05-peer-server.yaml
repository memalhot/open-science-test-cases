# Assisted by Claude Opus 4.6
apiVersion: v1
kind: Pod
metadata:
  name: t12-peer-load-low-moc-r4pcc02u05-peer-server
  namespace: uat-peer
  labels:
    app.kubernetes.io/managed-by: uat-generator
    test: peer-load-low
    dag-step: peer-server
    node: moc-r4pcc02u05
spec:
  tolerations:
    - key: nvidia.com/gpu.product
      operator: Exists
      effect: NoSchedule
  nodeSelector:
    kubernetes.io/hostname: moc-r4pcc02u05
  containers:
    - name: t12-peer-load-low-moc-r4pcc02u05-peer-server
      image: nvcr.io/nvidia/vllm:26.03-py3
      command:
        - python
        - -m
        - vllm.entrypoints.openai.api_server
        - --model=/models/ibm-granite/granite-3.3-8b-instruct
        - --port=8000
        - --tensor-parallel-size=2
        - --enable-chunked-prefill
      env:
        - name: HOME
          value: /tmp
      ports:
        - containerPort: 8000
          name: http
      readinessProbe:
        failureThreshold: 30
        httpGet:
          path: /health
          port: 8000
        initialDelaySeconds: 30
        periodSeconds: 10
        timeoutSeconds: 5
      resources:
        limits:
          nvidia.com/gpu: '2'
        requests:
          nvidia.com/gpu: '2'
      volumeMounts:
        - name: workspace
          mountPath: /uat_workspace
          subPath: uat/results/manual-run/t12-peer-load-low-moc-r4pcc02u05-peer-server
        - name: workspace
          mountPath: /binaries
          subPath: uat/results/manual-run/binaries
        - name: models
          mountPath: /models
          readOnly: true
  volumes:
    - name: workspace
      persistentVolumeClaim:
        claimName: uat-peer-storage
    - name: models
      persistentVolumeClaim:
        claimName: uat-models
  restartPolicy: Never

---
# Assisted by Claude Opus 4.6
apiVersion: v1
kind: Service
metadata:
  name: svc-t12-peer-load-low-moc-r4pcc02u05-peer-server
  namespace: uat-peer
  labels:
    app.kubernetes.io/managed-by: uat-generator
    test: peer-load-low
    dag-step: peer-server
    node: moc-r4pcc02u05
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/managed-by: uat-generator
    test: peer-load-low
    dag-step: peer-server
    node: moc-r4pcc02u05
  ports:
    - port: 8000
      targetPort: 8000
