# Assisted by Claude Opus 4.6
apiVersion: v1
kind: Pod
metadata:
  name: t1-platform-check-checker
  namespace: uat-project
  labels:
    app.kubernetes.io/managed-by: uat-generator
    test: platform-check
    dag-step: checker
    sweep: checker
spec:
  tolerations:
    - key: nvidia.com/gpu.product
      operator: Exists
      effect: NoSchedule
  containers:
    - name: t1-platform-check-checker
      image: registry.redhat.io/ubi9/ubi:9.8
      command:
        - /binaries/platform-check/test.bin
        - --ginkgo.label-filter=pass-fail
        - --ginkgo.junit-report=/uat_workspace/junit.xml
      env:
        - name: PERMISSION_CHECKS
          value: "[{\"type\": \"permission\", \"verb\": \"get\", \"resource\": \"pods\", \"expected\": \"no\"}, {\"type\": \"permission\", \"verb\": \"create\", \"resource\": \"pods\", \"expected\": \"no\"}, {\"type\": \"permission\", \"verb\": \"get\", \"resource\": \"secrets\", \"expected\": \"no\"}, {\"type\": \"permission\", \"verb\": \"get\", \"resource\": \"nodes\", \"expected\": \"no\"}, {\"type\": \"apiGroup\", \"group\": \"kubeflow.org\", \"expected\": \"yes\"}, {\"type\": \"apiGroup\", \"group\": \"serving.kserve.io\", \"expected\": \"yes\"}, {\"type\": \"apiGroup\", \"group\": \"ray.io\", \"expected\": \"yes\"}, {\"type\": \"apiGroup\", \"group\": \"nonexistent.example.io\", \"expected\": \"no\"}, {\"type\": \"crd\", \"apiVersion\": \"datasciencecluster.opendatahub.io/v1\", \"kind\": \"DataScienceCluster\", \"expected\": \"yes\"}, {\"type\": \"crd\", \"apiVersion\": \"dscinitialization.opendatahub.io/v1\", \"kind\": \"DSCInitialization\", \"expected\": \"yes\"}, {\"type\": \"crd\", \"apiVersion\": \"nvidia.com/v1\", \"kind\": \"ClusterPolicy\", \"expected\": \"yes\"}, {\"type\": \"crd\", \"apiVersion\": \"nfd.openshift.io/v1\", \"kind\": \"NodeFeatureDiscovery\", \"expected\": \"yes\"}, {\"type\": \"crd\", \"apiVersion\": \"operator.knative.dev/v1beta1\", \"kind\": \"KnativeServing\", \"expected\": \"yes\"}, {\"type\": \"crd\", \"apiVersion\": \"maistra.io/v2\", \"kind\": \"ServiceMeshControlPlane\", \"expected\": \"yes\"}]"
        - name: RESULTS_DIR
          value: /uat_workspace
      volumeMounts:
        - name: workspace
          mountPath: /uat_workspace
          subPath: uat/results/manual-run/t1-platform-check-checker
        - name: workspace
          mountPath: /binaries
          subPath: uat/results/manual-run/binaries
        - name: models
          mountPath: /models
          readOnly: true
  volumes:
    - name: workspace
      persistentVolumeClaim:
        claimName: uat-project-storage
    - name: models
      persistentVolumeClaim:
        claimName: uat-models
  restartPolicy: Never
