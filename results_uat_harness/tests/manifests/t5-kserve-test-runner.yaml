# Assisted by Claude Opus 4.6
apiVersion: v1
kind: Pod
metadata:
  name: t5-kserve-test-runner
  namespace: uat-project
  labels:
    app.kubernetes.io/managed-by: uat-generator
    test: kserve
    dag-step: test-runner
    sweep: test-runner
spec:
  tolerations:
    - key: nvidia.com/gpu.product
      operator: Exists
      effect: NoSchedule
  containers:
    - name: t5-kserve-test-runner
      image: registry.redhat.io/ubi9/ubi:9.8
      command:
        - /binaries/kserve/test.bin
        - --ginkgo.label-filter=pass-fail
        - --ginkgo.junit-report=/uat_workspace/junit.xml
      env:
        - name: SERVICE_URL
          value: "http://t5-kserve-isvc-predictor.uat-project.svc.cluster.local"
        - name: MODEL_NAME
          value: /models/ibm-granite/granite-3.3-8b-instruct
        - name: RESULTS_DIR
          value: /uat_workspace
      volumeMounts:
        - name: workspace
          mountPath: /uat_workspace
          subPath: uat/results/manual-run/t5-kserve-test-runner
        - name: workspace
          mountPath: /binaries
          subPath: uat/results/manual-run/binaries
        - name: models
          mountPath: /models
          readOnly: true
  volumes:
    - name: workspace
      persistentVolumeClaim:
        claimName: uat-project-storage
    - name: models
      persistentVolumeClaim:
        claimName: uat-models
  restartPolicy: Never
