# Assisted by Claude Opus 4.6
apiVersion: v1
kind: Pod
metadata:
  name: t3-iperf3-set0-iperf-client
  namespace: uat-project
  labels:
    app.kubernetes.io/managed-by: uat-generator
    test: iperf3
    dag-step: iperf-client
    node: moc-r4pcc02u09
    chain: set0
    sweep: iperf-client
spec:
  tolerations:
    - key: nvidia.com/gpu.product
      operator: Exists
      effect: NoSchedule
  nodeSelector:
    kubernetes.io/hostname: moc-r4pcc02u09
  containers:
    - name: t3-iperf3-set0-iperf-client
      image: docker.io/networkstatic/iperf3:latest
      command:
        - /binaries/iperf3/test.bin
        - --ginkgo.label-filter=pass-fail
        - --ginkgo.junit-report=/uat_workspace/junit.xml
      env:
        - name: SERVER_HOST
          value: svc-t3-iperf3-set0-iperf-server
        - name: RESULTS_DIR
          value: /uat_workspace
      volumeMounts:
        - name: workspace
          mountPath: /uat_workspace
          subPath: uat/results/manual-run/t3-iperf3-set0-iperf-client
        - name: workspace
          mountPath: /binaries
          subPath: uat/results/manual-run/binaries
        - name: models
          mountPath: /models
          readOnly: true
  volumes:
    - name: workspace
      persistentVolumeClaim:
        claimName: uat-project-storage
    - name: models
      persistentVolumeClaim:
        claimName: uat-models
  restartPolicy: Never
