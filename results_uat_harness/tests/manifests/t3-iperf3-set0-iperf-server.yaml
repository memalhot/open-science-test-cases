# Assisted by Claude Opus 4.6
apiVersion: v1
kind: Pod
metadata:
  name: t3-iperf3-set0-iperf-server
  namespace: uat-project
  labels:
    app.kubernetes.io/managed-by: uat-generator
    test: iperf3
    dag-step: iperf-server
    node: moc-r4pcc02u05
    chain: set0
spec:
  tolerations:
    - key: nvidia.com/gpu.product
      operator: Exists
      effect: NoSchedule
  nodeSelector:
    kubernetes.io/hostname: moc-r4pcc02u05
  containers:
    - name: t3-iperf3-set0-iperf-server
      image: docker.io/networkstatic/iperf3:latest
      command:
        - iperf3
        - -s
      ports:
        - containerPort: 5201
          name: iperf
      readinessProbe:
        failureThreshold: 6
        initialDelaySeconds: 5
        periodSeconds: 5
        tcpSocket:
          port: 5201
      volumeMounts:
        - name: workspace
          mountPath: /uat_workspace
          subPath: uat/results/manual-run/t3-iperf3-set0-iperf-server
        - name: workspace
          mountPath: /binaries
          subPath: uat/results/manual-run/binaries
        - name: models
          mountPath: /models
          readOnly: true
  volumes:
    - name: workspace
      persistentVolumeClaim:
        claimName: uat-project-storage
    - name: models
      persistentVolumeClaim:
        claimName: uat-models
  restartPolicy: Never

---
# Assisted by Claude Opus 4.6
apiVersion: v1
kind: Service
metadata:
  name: svc-t3-iperf3-set0-iperf-server
  namespace: uat-project
  labels:
    app.kubernetes.io/managed-by: uat-generator
    test: iperf3
    dag-step: iperf-server
    node: moc-r4pcc02u05
    chain: set0
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/managed-by: uat-generator
    test: iperf3
    dag-step: iperf-server
    node: moc-r4pcc02u05
  ports:
    - port: 5201
      targetPort: 5201
