# Assisted by Claude Opus 4.6
apiVersion: v1
kind: Pod
metadata:
  name: t10-ping-peer-check
  namespace: uat-peer
  labels:
    app.kubernetes.io/managed-by: uat-generator
    test: ping
    dag-step: peer-check
    sweep: peer-check
spec:
  tolerations:
    - key: nvidia.com/gpu.product
      operator: Exists
      effect: NoSchedule
  containers:
    - name: t10-ping-peer-check
      image: registry.redhat.io/ubi9/ubi:9.8
      command:
        - /binaries/ping/test.bin
        - --ginkgo.label-filter=peer-check
        - --ginkgo.junit-report=/uat_workspace/junit.xml
      env:
        - name: OWN_URL
          value: "http://svc-t10-ping-peer-server:8080"
        - name: OTHER_SHORT_URL
          value: "http://svc-t10-ping-project-server:8080"
        - name: OTHER_FQDN_URL
          value: "http://svc-t10-ping-project-server.uat-project.svc.cluster.local:8080"
        - name: RESULTS_DIR
          value: /uat_workspace
      volumeMounts:
        - name: workspace
          mountPath: /uat_workspace
          subPath: uat/results/manual-run/t10-ping-peer-check
        - name: workspace
          mountPath: /binaries
          subPath: uat/results/manual-run/binaries
        - name: models
          mountPath: /models
          readOnly: true
  volumes:
    - name: workspace
      persistentVolumeClaim:
        claimName: uat-peer-storage
    - name: models
      persistentVolumeClaim:
        claimName: uat-models
  restartPolicy: Never
