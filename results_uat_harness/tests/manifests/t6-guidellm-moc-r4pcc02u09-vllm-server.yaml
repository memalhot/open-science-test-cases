# Assisted by Claude Opus 4.6
apiVersion: v1
kind: Pod
metadata:
  name: t6-guidellm-moc-r4pcc02u09-vllm-server
  namespace: uat-project
  labels:
    app.kubernetes.io/managed-by: uat-generator
    test: guidellm
    dag-step: vllm-server
    node: moc-r4pcc02u09
spec:
  tolerations:
    - key: nvidia.com/gpu.product
      operator: Exists
      effect: NoSchedule
  nodeSelector:
    kubernetes.io/hostname: moc-r4pcc02u09
  containers:
    - name: t6-guidellm-moc-r4pcc02u09-vllm-server
      image: nvcr.io/nvidia/vllm:26.03-py3
      command:
        - python
        - -m
        - vllm.entrypoints.openai.api_server
        - --model=/models/ibm-granite/granite-3.3-8b-instruct
        - --port=8000
        - --max-model-len=10000
        - --gpu-memory-utilization=0.6
      env:
        - name: HOME
          value: /tmp
      ports:
        - containerPort: 8000
          name: http
      readinessProbe:
        failureThreshold: 30
        httpGet:
          path: /health
          port: 8000
        initialDelaySeconds: 30
        periodSeconds: 10
        timeoutSeconds: 5
      resources:
        limits:
          nvidia.com/gpu: '1'
        requests:
          nvidia.com/gpu: '1'
      volumeMounts:
        - name: workspace
          mountPath: /uat_workspace
          subPath: uat/results/manual-run/t6-guidellm-moc-r4pcc02u09-vllm-server
        - name: workspace
          mountPath: /binaries
          subPath: uat/results/manual-run/binaries
        - name: models
          mountPath: /models
          readOnly: true
  volumes:
    - name: workspace
      persistentVolumeClaim:
        claimName: uat-project-storage
    - name: models
      persistentVolumeClaim:
        claimName: uat-models
  restartPolicy: Never

---
# Assisted by Claude Opus 4.6
apiVersion: v1
kind: Service
metadata:
  name: svc-t6-guidellm-moc-r4pcc02u09-vllm-server
  namespace: uat-project
  labels:
    app.kubernetes.io/managed-by: uat-generator
    test: guidellm
    dag-step: vllm-server
    node: moc-r4pcc02u09
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/managed-by: uat-generator
    test: guidellm
    dag-step: vllm-server
    node: moc-r4pcc02u09
  ports:
    - port: 8000
      targetPort: 8000
