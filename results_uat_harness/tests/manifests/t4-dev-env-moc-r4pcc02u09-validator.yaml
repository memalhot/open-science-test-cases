# Assisted by Claude Opus 4.6
apiVersion: v1
kind: Pod
metadata:
  name: t4-dev-env-moc-r4pcc02u09-validator
  namespace: uat-project
  labels:
    app.kubernetes.io/managed-by: uat-generator
    test: dev-env
    dag-step: validator
    node: moc-r4pcc02u09
    sweep: validator
spec:
  tolerations:
    - key: nvidia.com/gpu.product
      operator: Exists
      effect: NoSchedule
  nodeSelector:
    kubernetes.io/hostname: moc-r4pcc02u09
  containers:
    - name: t4-dev-env-moc-r4pcc02u09-validator
      image: registry.redhat.io/ubi9/ubi:9.8
      command:
        - /binaries/dev-env/test.bin
        - --ginkgo.label-filter=pass-fail
        - --ginkgo.junit-report=/uat_workspace/junit.xml
      env:
        - name: SERVER_URL
          value: "http://svc-t4-dev-env-moc-r4pcc02u09-notebook-server:8888"
        - name: EXPECTED_GPU_COUNT
          value: "4"
        - name: EXPECTED_NVLINK
          value: NV6
        - name: RESULTS_DIR
          value: /uat_workspace
      volumeMounts:
        - name: workspace
          mountPath: /uat_workspace
          subPath: uat/results/manual-run/t4-dev-env-moc-r4pcc02u09-validator
        - name: workspace
          mountPath: /binaries
          subPath: uat/results/manual-run/binaries
        - name: models
          mountPath: /models
          readOnly: true
  volumes:
    - name: workspace
      persistentVolumeClaim:
        claimName: uat-project-storage
    - name: models
      persistentVolumeClaim:
        claimName: uat-models
  restartPolicy: Never
