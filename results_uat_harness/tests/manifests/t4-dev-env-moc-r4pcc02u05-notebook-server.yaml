# Assisted by Claude Opus 4.6
apiVersion: v1
kind: Pod
metadata:
  name: t4-dev-env-moc-r4pcc02u05-notebook-server
  namespace: uat-project
  labels:
    app.kubernetes.io/managed-by: uat-generator
    test: dev-env
    dag-step: notebook-server
    node: moc-r4pcc02u05
spec:
  tolerations:
    - key: nvidia.com/gpu.product
      operator: Exists
      effect: NoSchedule
  nodeSelector:
    kubernetes.io/hostname: moc-r4pcc02u05
  containers:
    - name: t4-dev-env-moc-r4pcc02u05-notebook-server
      image: quay.io/jschless/ml-dev-env:latest
      command:
        - jupyter
        - lab
        - --notebook-dir=/uat_workspace
        - --ip=0.0.0.0
        - --port=8888
        - --no-browser
        - --IdentityProvider.token=
        - --ServerApp.disable_check_xsrf=True
      env:
        - name: HOME
          value: /tmp
      ports:
        - containerPort: 8888
      readinessProbe:
        failureThreshold: 30
        httpGet:
          path: /api/status
          port: 8888
        initialDelaySeconds: 30
        periodSeconds: 10
        timeoutSeconds: 5
      resources:
        limits:
          nvidia.com/gpu: '4'
        requests:
          nvidia.com/gpu: '4'
      volumeMounts:
        - name: workspace
          mountPath: /uat_workspace
          subPath: uat/results/manual-run/t4-dev-env-moc-r4pcc02u05-notebook-server
        - name: workspace
          mountPath: /binaries
          subPath: uat/results/manual-run/binaries
        - name: models
          mountPath: /models
          readOnly: true
  volumes:
    - name: workspace
      persistentVolumeClaim:
        claimName: uat-project-storage
    - name: models
      persistentVolumeClaim:
        claimName: uat-models
  restartPolicy: Never

---
# Assisted by Claude Opus 4.6
apiVersion: v1
kind: Service
metadata:
  name: svc-t4-dev-env-moc-r4pcc02u05-notebook-server
  namespace: uat-project
  labels:
    app.kubernetes.io/managed-by: uat-generator
    test: dev-env
    dag-step: notebook-server
    node: moc-r4pcc02u05
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/managed-by: uat-generator
    test: dev-env
    dag-step: notebook-server
    node: moc-r4pcc02u05
  ports:
    - port: 8888
      targetPort: 8888
