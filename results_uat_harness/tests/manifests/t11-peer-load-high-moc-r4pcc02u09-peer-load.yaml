# Assisted by Claude Opus 4.6
apiVersion: v1
kind: Pod
metadata:
  name: t11-peer-load-high-moc-r4pcc02u09-peer-load
  namespace: uat-peer
  labels:
    app.kubernetes.io/managed-by: uat-generator
    test: peer-load-high
    dag-step: peer-load
    node: moc-r4pcc02u09
spec:
  tolerations:
    - key: nvidia.com/gpu.product
      operator: Exists
      effect: NoSchedule
  nodeSelector:
    kubernetes.io/hostname: moc-r4pcc02u09
  containers:
    - name: t11-peer-load-high-moc-r4pcc02u09-peer-load
      image: quay.io/inference-perf/inference-perf:v0.6.1
      command:
        - inference-perf
        - --server.type=vllm
        - "--server.base_url=http://svc-t11-peer-load-high-moc-r4pcc02u09-peer-server:8000"
        - --server.model_name=/models/ibm-granite/granite-3.3-8b-instruct
        - --server.ignore_eos=true
        - --api.type=completion
        - --api.streaming=true
        - --data.type=random
        - --data.input_distribution.min=64
        - --data.input_distribution.max=256
        - --data.input_distribution.mean=128
        - --data.input_distribution.std_dev=32
        - --data.output_distribution.min=32
        - --data.output_distribution.max=128
        - --data.output_distribution.mean=64
        - --data.output_distribution.std_dev=16
        - --load.type=constant
        - --load.num_workers=4
        - "--load.stages=[{\"rate\": 10, \"duration\": 600}]"
        - --storage.local_storage.path=/uat_workspace
        - --report.request_lifecycle.summary=true
        - --report.request_lifecycle.per_request=false
      env:
        - name: HOME
          value: /tmp
      volumeMounts:
        - name: workspace
          mountPath: /uat_workspace
          subPath: uat/results/manual-run/t11-peer-load-high-moc-r4pcc02u09-peer-load
        - name: workspace
          mountPath: /binaries
          subPath: uat/results/manual-run/binaries
        - name: models
          mountPath: /models
          readOnly: true
  volumes:
    - name: workspace
      persistentVolumeClaim:
        claimName: uat-peer-storage
    - name: models
      persistentVolumeClaim:
        claimName: uat-models
  restartPolicy: Never
