# Assisted by Claude Opus 4.6
apiVersion: v1
kind: Pod
metadata:
  name: peer-uat-aggregator
  namespace: uat-peer
  labels:
    app.kubernetes.io/managed-by: uat-generator
spec:
  tolerations:
    - key: nvidia.com/gpu.product
      operator: Exists
      effect: NoSchedule
  containers:
    - name: peer-uat-aggregator
      image: python:3-slim
      command: ["sleep", "infinity"]
      volumeMounts:
        - name: workspace
          mountPath: /uat_workspace
          subPath: uat/results/manual-run
        - name: source
          mountPath: /src
  volumes:
    - name: workspace
      persistentVolumeClaim:
        claimName: uat-peer-storage
    - name: source
      configMap:
        name: uat-test-source
  restartPolicy: Never
