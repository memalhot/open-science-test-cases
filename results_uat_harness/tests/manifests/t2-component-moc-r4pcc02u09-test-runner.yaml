# Assisted by Claude Opus 4.6
apiVersion: v1
kind: Pod
metadata:
  name: t2-component-moc-r4pcc02u09-test-runner
  namespace: uat-project
  labels:
    app.kubernetes.io/managed-by: uat-generator
    test: component
    dag-step: test-runner
    node: moc-r4pcc02u09
    sweep: test-runner
spec:
  tolerations:
    - key: nvidia.com/gpu.product
      operator: Exists
      effect: NoSchedule
  nodeSelector:
    kubernetes.io/hostname: moc-r4pcc02u09
  containers:
    - name: t2-component-moc-r4pcc02u09-test-runner
      image: registry.redhat.io/ubi9/ubi:9.8
      command:
        - /binaries/component/test.bin
        - --ginkgo.label-filter=pass-fail
        - --ginkgo.junit-report=/uat_workspace/junit.xml
      env:
        - name: NODE_NAME
          value: moc-r4pcc02u09
        - name: RESULTS_DIR
          value: /uat_workspace
      resources:
        limits:
          nvidia.com/gpu: '4'
        requests:
          nvidia.com/gpu: '4'
      volumeMounts:
        - name: workspace
          mountPath: /uat_workspace
          subPath: uat/results/manual-run/t2-component-moc-r4pcc02u09-test-runner
        - name: workspace
          mountPath: /binaries
          subPath: uat/results/manual-run/binaries
        - name: models
          mountPath: /models
          readOnly: true
  volumes:
    - name: workspace
      persistentVolumeClaim:
        claimName: uat-project-storage
    - name: models
      persistentVolumeClaim:
        claimName: uat-models
  restartPolicy: Never
