# Assisted by Claude Opus 4.6
apiVersion: v1
kind: Pod
metadata:
  name: t10-ping-project-server
  namespace: uat-project
  labels:
    app.kubernetes.io/managed-by: uat-generator
    test: ping
    dag-step: project-server
spec:
  tolerations:
    - key: nvidia.com/gpu.product
      operator: Exists
      effect: NoSchedule
  containers:
    - name: t10-ping-project-server
      image: registry.redhat.io/ubi9/ubi:9.8
      command:
        - python3
        - -m
        - http.server
        - "8080"
      ports:
        - containerPort: 8080
      readinessProbe:
        failureThreshold: 6
        httpGet:
          path: /
          port: 8080
        initialDelaySeconds: 2
        periodSeconds: 5
      volumeMounts:
        - name: workspace
          mountPath: /uat_workspace
          subPath: uat/results/manual-run/t10-ping-project-server
        - name: workspace
          mountPath: /binaries
          subPath: uat/results/manual-run/binaries
        - name: models
          mountPath: /models
          readOnly: true
  volumes:
    - name: workspace
      persistentVolumeClaim:
        claimName: uat-project-storage
    - name: models
      persistentVolumeClaim:
        claimName: uat-models
  restartPolicy: Never

---
# Assisted by Claude Opus 4.6
apiVersion: v1
kind: Service
metadata:
  name: svc-t10-ping-project-server
  namespace: uat-project
  labels:
    app.kubernetes.io/managed-by: uat-generator
    test: ping
    dag-step: project-server
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/managed-by: uat-generator
    test: ping
    dag-step: project-server
  ports:
    - port: 8080
      targetPort: 8080
