apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: llm-model
  namespace: model-serving
  labels:
    app: llm-model
    component: model-server
spec:
  to:
    kind: Service
    name: llm-model
    weight: 100
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
  wildcardPolicy: None
