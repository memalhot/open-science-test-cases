# OpenShift-specific Helm values for NVIDIA OpenShell
# Based on: https://github.com/NVIDIA/openshell/blob/main/deploy/helm/openshell/README.md#install-on-openshift

# Disable TLS at gateway level (Route handles TLS termination)
server:
  disableTls: true

  # DEMO-ONLY / UNSAFE: accept unauthenticated CLI requests. The gateway ships
  # no OIDC issuer and no mTLS client certs, so an external `openshell` CLI has
  # no credential to present and is otherwise rejected with
  # "missing authorization header". This flag lets the plaintext local
  # registration (`openshell gateway add http://127.0.0.1:8080 --local`) work.
  # Do NOT enable on a shared/production gateway — configure OIDC instead.
  auth:
    allowUnauthenticatedUsers: true

  # Kubernetes driver configuration
  drivers:
    kubernetes:
      # "shared": all sandboxes land in the single sandboxNamespace below, which
      # deploy.sh grants the privileged SCC. "managed" auto-creates per-workspace
      # namespaces (e.g. openshell-openshell-default) which lack OpenShift's SCC
      # annotation openshift.io/sa.scc.mcs, so sandbox pods are forbidden:
      #   pods "..." is forbidden: ... unable to find annotation openshift.io/sa.scc.mcs
      workspaceMode: shared

  # Sandbox configuration
  sandboxNamespace: openshell-sandboxes
  sandboxImage: "ghcr.io/nvidia/openshell-community/sandboxes/base:latest"
  sandboxImagePullPolicy: Always

  # Storage for workspaces
  workspaceStorageClass: ""  # Use cluster default
  workspaceDefaultStorageSize: "10Gi"

  # Telemetry (disable for privacy)
  telemetryEnabled: false

# Pod security context - let OpenShift auto-assign
podSecurityContext:
  fsGroup: null

# Container security context - let OpenShift auto-assign
securityContext:
  runAsUser: null

# StatefulSet for SQLite default
workload:
  kind: statefulset

# Single replica for SQLite (use deployment + PostgreSQL for HA)
replicaCount: 1

# Agent sandbox preflight check
agentSandbox:
  preflight:
    enabled: true

# Network policy (restricts sandbox SSH to gateway only)
networkPolicy:
  enabled: true

# Resource limits
resources:
  requests:
    memory: "256Mi"
    cpu: "200m"
  limits:
    memory: "1Gi"
    cpu: "1000m"

# Persistence for SQLite database
persistence:
  enabled: true
  size: 5Gi
  # storageClass: ""  # Use default

# Service configuration
service:
  type: ClusterIP
  ports:
    grpc: 8080
    health: 8081
    metrics: 9090
