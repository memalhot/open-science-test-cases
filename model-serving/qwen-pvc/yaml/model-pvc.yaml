apiVersion: template.openshift.io/v1
kind: Template
metadata:
  name: model-pvc
parameters:
  - name: PVC_NAME
    description: Name of the PersistentVolumeClaim
    value: qwen-model-pvc
  - name: STORAGE_SIZE
    description: Size of the PVC
    value: 20Gi
  - name: STORAGE_CLASS
    description: StorageClass to use (cluster default is pure-fb-nfsv4, Pure FlashBlade over NFS)
    value: pure-fb-nfsv4
  - name: ACCESS_MODE
    description: Access mode (ReadWriteMany for file storage such as pure-fb-nfsv4, ReadWriteOnce for block)
    value: ReadWriteMany
objects:
  - apiVersion: v1
    kind: PersistentVolumeClaim
    metadata:
      name: ${PVC_NAME}
      # The dashboard lists PVCs with labelSelector opendatahub.io/dashboard=true.
      # Without this label the PVC is invisible in the UI, and the "Existing
      # cluster storage" model-source option is hidden entirely (it only renders
      # when that filtered list is non-empty).
      labels:
        opendatahub.io/dashboard: "true"
      annotations:
        openshift.io/display-name: ${PVC_NAME}
    spec:
      accessModes:
        - ${ACCESS_MODE}
      storageClassName: ${STORAGE_CLASS}
      resources:
        requests:
          storage: ${STORAGE_SIZE}
