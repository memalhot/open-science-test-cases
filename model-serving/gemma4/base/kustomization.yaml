apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Default namespace; the generated overlay (overlays/current) overrides this
# from scripts/config.conf.
namespace: eldritchjs-sandbox

# Shared across serving modes: the Pure RWX weight store plus the tunable vLLM
# knobs. The serving mechanism itself (plain Deployment vs. KServe) is layered on
# by a kustomize component — components/lazy or components/kserve — which the
# generated overlay selects from SERVE_MODE in scripts/config.conf.
resources:
  - pvc.yaml

# Tunable vLLM args. The name-suffix hash means any value change rolls the pod.
configMapGenerator:
  - name: gemma4-params
    envs:
      - params.properties
