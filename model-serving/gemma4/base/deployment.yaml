# vLLM serving one Gemma 4 model, OpenAI-compatible API on :8000.
# Tunable values (model id, served name, TP size, max-model-len, gpu-mem-util)
# come from the "gemma4-params" ConfigMap and are expanded into args via the
# Kubernetes $(VAR) mechanism. The GPU limit and image are set by the overlay
# (see overlays/current, generated by scripts/up.sh from scripts/config.conf).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gemma4-vllm
  labels: { app: gemma4-vllm }
spec:
  replicas: 1
  selector:
    matchLabels: { app: gemma4-vllm }
  template:
    metadata:
      labels: { app: gemma4-vllm }
    spec:
      containers:
        - name: vllm
          # Dedicated Gemma-4 tag: bundles transformers>=5.5.0 (required for the
          # gemma4 arch). Generic :latest FAILS with "model type 'gemma4' not
          # recognized". :gemma4 = CUDA 12.9; :gemma4-cu130 needs a newer driver.
          # vLLM auto-selects TRITON_ATTN for Gemma 4 (no config needed).
          # Fully-qualified: OpenShift CRI-O enforces short-name-mode, so the
          # bare "vllm/vllm-openai:gemma4" is rejected as ambiguous.
          image: docker.io/vllm/vllm-openai:gemma4
          args:
            - "--model=$(MODEL_ID)"
            - "--served-model-name=$(SERVED_NAME)"
            - "--tensor-parallel-size=$(TP_SIZE)"
            - "--max-model-len=$(MAX_MODEL_LEN)"
            - "--gpu-memory-utilization=$(GPU_MEM_UTIL)"
            - "--port=8000"
          env:
            # --- tunables, sourced from the gemma4-params ConfigMap ---
            # (kustomize rewrites the configMap name to its hashed variant, so a
            #  value change produces a new hash -> a new rollout automatically.)
            - name: MODEL_ID
              valueFrom: { configMapKeyRef: { name: gemma4-params, key: MODEL_ID } }
            - name: SERVED_NAME
              valueFrom: { configMapKeyRef: { name: gemma4-params, key: SERVED_NAME } }
            - name: TP_SIZE
              valueFrom: { configMapKeyRef: { name: gemma4-params, key: TP_SIZE } }
            - name: MAX_MODEL_LEN
              valueFrom: { configMapKeyRef: { name: gemma4-params, key: MAX_MODEL_LEN } }
            - name: GPU_MEM_UTIL
              valueFrom: { configMapKeyRef: { name: gemma4-params, key: GPU_MEM_UTIL } }
            # --- static env ---
            - name: HF_HOME
              value: "/cache"              # weights land on the PVC, not ephemeral
            - name: HOME
              # OpenShift runs a random UID with HOME=/ (not writable). Point it
              # at a writable emptyDir so flashinfer/torch caches (~/.cache) work.
              value: "/home/vllm"
            - name: HUGGING_FACE_HUB_TOKEN
              valueFrom:
                # optional: model is public/ungated, so pod starts with or
                # without the secret. Create hf-token to improve rate limits.
                secretKeyRef: { name: hf-token, key: token, optional: true }
          ports:
            - { name: http, containerPort: 8000 }
          resources:
            limits:
              nvidia.com/gpu: "2"        # overridden by overlay (GPU_COUNT); == TP_SIZE
              memory: 96Gi
            requests:
              cpu: "8"
              memory: 48Gi
          volumeMounts:
            - { name: model-cache, mountPath: /cache }
            - { name: shm, mountPath: /dev/shm }   # vLLM needs a large /dev/shm
            - { name: home, mountPath: /home/vllm }  # writable HOME for caches
          # Model download + load takes minutes; be generous before killing.
          startupProbe:
            httpGet: { path: /health, port: 8000 }
            periodSeconds: 15
            failureThreshold: 80           # ~20 min budget for first pull+load
          readinessProbe:
            httpGet: { path: /health, port: 8000 }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: 8000 }
            periodSeconds: 20
            failureThreshold: 6
      volumes:
        - name: model-cache
          persistentVolumeClaim: { claimName: model-cache }
        - name: shm
          emptyDir: { medium: Memory, sizeLimit: 16Gi }  # NCCL needs shm for TP
        - name: home
          emptyDir: {}
