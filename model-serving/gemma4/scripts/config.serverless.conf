# ============================================================================
# KServe Serverless (Knative) Gemma 4 run — concurrency autoscaling + scale-to-zero.
# Use it with:
#     CONFIG_FILE=config.serverless.conf ./up.sh
#     CONFIG_FILE=config.serverless.conf ./test.sh
#     CONFIG_FILE=config.serverless.conf ./down.sh
# (CONFIG_FILE is resolved next to the scripts, so you can run from anywhere.)
#
# This is the third serving mode. Where SERVE_MODE=kserve gives a RawDeployment
# predictor with a CPU/memory HPA, SERVE_MODE=serverless puts the same seeded
# InferenceService behind Knative: the Knative Pod Autoscaler (KPA) scales on
# CONCURRENCY (in-flight requests per replica) — the right signal for an LLM — and,
# with MIN_REPLICAS=0, scales the predictor all the way to ZERO when idle, so it
# holds no GPUs at rest and cold-starts on the next request.
#
# It is built on the quantized single-GPU checkpoint on purpose: TP=1 => one GPU
# per replica, so 0 -> N scaling is feasible on a small GPU box, and scale-to-zero
# actually frees a whole GPU. Requires the cluster's Serverless stack (Knative
# Serving + a Knative ingress; here net-istio/Service Mesh) — present on RHOAI when
# KServe's default deploymentMode is Serverless.
#
# Every value can still be overridden by an env var of the same name (env wins).
# ============================================================================

# --- Target ---
NAMESPACE=eldritchjs-sandbox

# --- Serving mode ---
SERVE_MODE=serverless
IMAGE=docker.io/vllm/vllm-openai:gemma4

# --- Model / runtime knobs ---
# QAT w4a16 compressed-tensors checkpoint (one GPU per replica so scaling fits).
MODEL_ID=google/gemma-4-31B-it-qat-w4a16-ct
SERVED_NAME=gemma-4              # same served name → test.sh/benchmark.sh unchanged
TP_SIZE=1                        # single GPU per replica; MUST equal GPU_COUNT
MAX_MODEL_LEN=8192
GPU_MEM_UTIL=0.90

# --- Hardware / storage ---
GPU_COUNT=1                      # one H100 per replica; MUST equal TP_SIZE
STORAGE_SIZE=60Gi                # w4a16 weights are ~1/4 of BF16 — 60Gi is roomy

# --- Autoscaling (Knative KPA) ---
# MIN_REPLICAS=0 enables scale-to-zero (no GPU held when idle; next request cold-
# starts a pod). MAX_REPLICAS caps scale-out — each replica needs TP_SIZE GPUs, so
# keep MAX_REPLICAS * GPU_COUNT <= schedulable GPUs. SCALE_METRIC is concurrency
# (or rps) for KPA; SCALE_TARGET is in-flight requests per replica (not a percent).
MIN_REPLICAS=0
MAX_REPLICAS=3
SCALE_METRIC=concurrency
SCALE_TARGET=10

# --- Optional HuggingFace token ---
HF_TOKEN=
