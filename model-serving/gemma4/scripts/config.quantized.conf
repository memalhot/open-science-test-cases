# ============================================================================
# Single-GPU quantized Gemma 4 run. Use it with:
#     CONFIG_FILE=config.quantized.conf ./up.sh
#     CONFIG_FILE=config.quantized.conf ./test.sh
#     CONFIG_FILE=config.quantized.conf ./down.sh
# (CONFIG_FILE is resolved next to the scripts, so you can run from anywhere.)
#
# Same scripts, same Pure PVC, ONE H100 instead of two — this is the cost/perf
# lever. The QAT w4a16 checkpoint is ~1/4 the size of the BF16 weights, so it
# loads with TP=1 on a single 80GB H100 (weights + KV cache fit comfortably).
# vLLM auto-detects the compressed-tensors quantization from the model config —
# no --quantization flag needed.
#
# Every value can still be overridden by an env var of the same name (env wins).
# ============================================================================

# --- Target ---
NAMESPACE=eldritchjs-sandbox

# --- Serving mode ---
# Works in either mode. lazy is the fewest-dependencies path; switch to kserve
# (SERVE_MODE=kserve, or --mode kserve) to add the seed Job + InferenceService,
# and then autoscaling: because TP=1 uses one GPU per replica, a 1->2 scale-out
# fits in two GPUs (set MAX_REPLICAS=2 below or via env).
SERVE_MODE=lazy
IMAGE=docker.io/vllm/vllm-openai:gemma4

# --- Model / runtime knobs ---
# QAT (quantization-aware trained) w4a16 compressed-tensors checkpoint. Case
# matters, exactly as with the BF16 repo id.
MODEL_ID=google/gemma-4-31B-it-qat-w4a16-ct
SERVED_NAME=gemma-4              # same served name → test.sh/benchmark.sh unchanged
TP_SIZE=1                        # single GPU; MUST equal GPU_COUNT
MAX_MODEL_LEN=8192
GPU_MEM_UTIL=0.90

# --- Hardware / storage ---
GPU_COUNT=1                      # one H100; MUST equal TP_SIZE
STORAGE_SIZE=60Gi                # w4a16 weights are ~1/4 of BF16 — 60Gi is roomy

# --- Autoscaling (kserve mode only) ---
# Left at a fixed single replica by default. For the autoscaling demo on this
# quantized variant, run e.g.:
#     CONFIG_FILE=config.quantized.conf MAX_REPLICAS=2 ./up.sh --mode kserve
MIN_REPLICAS=1
MAX_REPLICAS=1
SCALE_METRIC=cpu
SCALE_TARGET=60

# --- Optional HuggingFace token ---
HF_TOKEN=
