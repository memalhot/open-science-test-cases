# ============================================================================
# Single source of truth for a Gemma 4 serving run.
# Edit these values, then run ./up.sh. Every value can also be overridden by an
# environment variable of the same name (env wins over this file), e.g.:
#     TP_SIZE=4 GPU_COUNT=4 ./up.sh
# ============================================================================

# --- Target ---
NAMESPACE=eldritchjs-sandbox

# --- Serving mode ---
# How the model is served. Both modes use the same Pure RWX PVC as the weight
# store; they differ in how weights get there and what fronts vLLM:
#   lazy   = plain Deployment. vLLM pulls the weights from HuggingFace into the
#            PVC on first boot. No KServe/RHOAI dependency — works anywhere.
#   kserve = KServe InferenceService serving from pvc://model-cache. An explicit
#            seed Job pre-stages the weights onto the PVC before serving starts.
#            Requires RHOAI single-model serving (KServe) on the cluster.
SERVE_MODE=lazy
# vLLM image. Must be a build that supports the gemma4 architecture
# (transformers >= 5.5.0). Fully-qualified for OpenShift short-name-mode.
IMAGE=docker.io/vllm/vllm-openai:gemma4

# --- Model / runtime knobs ---
MODEL_ID=google/gemma-4-31B-it   # case-sensitive HF repo id
SERVED_NAME=gemma-4              # name clients call in the OpenAI API
TP_SIZE=2                        # tensor-parallel size; MUST equal GPU_COUNT
MAX_MODEL_LEN=8192
GPU_MEM_UTIL=0.90

# --- Hardware / storage ---
GPU_COUNT=2                      # nvidia.com/gpu limit; MUST equal TP_SIZE
STORAGE_SIZE=150Gi               # weight-cache PVC size

# --- Optional HuggingFace token ---
# Only improves download rate limits (the target model is public/ungated).
# Prefer exporting HF_TOKEN in your shell over writing a real token here.
HF_TOKEN=
