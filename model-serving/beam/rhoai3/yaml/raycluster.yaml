# Beam 1.0 served by vLLM with the tensor-parallel group spread across two
# nodes by Ray.
#
# WHY RAY AND NOT A SINGLE POD
# Beam NVFP4 is 294GB of weights. A single GPU node here has 4xH100-80GB =
# 320GB, which the weights alone would nearly exhaust before any KV cache. So
# the TP group has to span both GPU nodes, and vLLM's cross-node executor is
# Ray (`--distributed-executor-backend ray`).
#
# TOPOLOGY
#   head pod    : ray-head container holds 4 GPUs (TP ranks 0-3)
#                 vllm      container holds 0 GPUs — it is the vLLM *driver*,
#                           which coordinates the ranks and serves the HTTP API
#   worker pod  : ray-worker container holds 4 GPUs (TP ranks 4-7)
#
# The two pods land on different nodes without any anti-affinity rule, simply
# because each asks for 4 GPUs and each node has exactly 4 allocatable.
#
# The vLLM driver is a sidecar in the head pod rather than a separate Deployment
# so it can reach the GCS over loopback (RAY_ADDRESS=127.0.0.1:6379) and shares
# the head's lifecycle. It requests no GPU of its own: in vLLM V1 the Ray
# executor places all TP ranks as actors in the placement group, and the driver
# process itself never touches a device.
apiVersion: ray.io/v1
kind: RayCluster
metadata:
  name: beam
  labels:
    app: beam
spec:
  rayVersion: "__RAY_VERSION__"

  # ---------------------------------------------------------------------------
  # Head: Ray GCS + 4 TP ranks + the vLLM driver/API server
  # ---------------------------------------------------------------------------
  headGroupSpec:
    rayStartParams:
      # Declared explicitly rather than autodetected so that the number Ray
      # advertises always matches the GPU limit below — if these ever disagree,
      # vLLM's placement group either over-subscribes devices or hangs forever
      # waiting for ranks that cannot be placed.
      num-gpus: "__HEAD_GPUS__"
      dashboard-host: "0.0.0.0"
    template:
      metadata:
        labels:
          app: beam
      spec:
        tolerations:
          - key: nvidia.com/gpu.product
            operator: Exists
            effect: NoSchedule
        containers:
          # The Ray container MUST be index 0 — KubeRay injects its generated
          # `ray start --head ... --block` command into that container, and we
          # deliberately leave `command` unset so it can.
          - name: ray-head
            image: __IMAGE__
            env:
              # OpenShift runs the pod as a random UID with HOME=/ (not
              # writable). torch/flashinfer write JIT and kernel caches under
              # ~/.cache, so an unwritable HOME crashes the ranks at startup with
              #   PermissionError: [Errno 13] Permission denied: '/.cache'
              - name: HOME
                value: "/home/ray"
              # Share vLLM's torch.compile cache across BOTH nodes on the RWX
              # PVC. Compiling Beam's 52-layer MoE graph is slow; with the cache
              # on shared storage the second node's ranks hit it instead of
              # repeating the work, and restarts become warm.
              - name: VLLM_CACHE_ROOT
                value: "/models/.vllm-cache"
              - name: HF_HOME
                value: "/models/.hf-home"
              # No RDMA device plugin is exposed on this cluster, so NCCL must
              # not try to probe InfiniBand — left enabled it spends a long time
              # failing over before falling back to TCP sockets.
              - name: NCCL_IB_DISABLE
                value: "__NCCL_IB_DISABLE__"
              - name: NCCL_SOCKET_IFNAME
                value: "__NCCL_SOCKET_IFNAME__"
              - name: GLOO_SOCKET_IFNAME
                value: "__NCCL_SOCKET_IFNAME__"
              - name: NCCL_DEBUG
                value: "WARN"
            ports:
              - { containerPort: 6379,  name: gcs }
              - { containerPort: 8265,  name: dashboard }
              - { containerPort: 10001, name: client }
            resources:
              requests:
                cpu: "16"
                memory: 128Gi
              limits:
                nvidia.com/gpu: "__HEAD_GPUS__"
                memory: 256Gi
            volumeMounts:
              - { name: weights, mountPath: /models }
              - { name: ray-home, mountPath: /home/ray }
              # Ray's object store and NCCL both live in shared memory; the
              # container default of 64MB is far too small and Ray will warn and
              # then perform terribly.
              - { name: shm, mountPath: /dev/shm }

          - name: vllm
            image: __IMAGE__
            command: ["/bin/sh", "-c"]
            args:
              - |
                set -eu

                # Ray's GCS is in the sibling container and the worker pod still
                # has to join, so the driver must not start vLLM until the full
                # TP group's worth of GPUs is actually registered. Starting
                # early is not benign: vLLM builds its placement group from
                # whatever is available at that instant and then blocks forever
                # on ranks that never arrive.
                echo "Waiting for Ray to register __TP_SIZE__ GPUs..."
                python3 - <<'PYWAIT'
                import os, sys, time
                import ray

                want = int(os.environ["TP_SIZE"])
                ray.init(address=os.environ["RAY_ADDRESS"], log_to_driver=False)
                deadline = time.time() + 1800
                have = 0
                while time.time() < deadline:
                    have = int(ray.cluster_resources().get("GPU", 0))
                    if have >= want:
                        print(f"Ray cluster has {have} GPUs; proceeding.", flush=True)
                        sys.exit(0)
                    print(f"  {have}/{want} GPUs registered...", flush=True)
                    time.sleep(10)
                print(f"FATAL: only {have}/{want} GPUs after 30m", file=sys.stderr)
                sys.exit(1)
                PYWAIT

                # Optional flags, omitted entirely when unset in config.conf
                # (an empty `--moe-backend` would be rejected by vLLM).
                EXTRA=""
                if [ -n "__MOE_BACKEND__" ]; then
                  EXTRA="${EXTRA} --moe-backend=__MOE_BACKEND__"
                fi
                if [ -n "__KV_CACHE_DTYPE__" ] && [ "__KV_CACHE_DTYPE__" != "auto" ]; then
                  EXTRA="${EXTRA} --kv-cache-dtype=__KV_CACHE_DTYPE__"
                fi

                echo "Starting vLLM (TP=__TP_SIZE__ over Ray)"
                # shellcheck disable=SC2086
                exec python3 -m vllm.entrypoints.openai.api_server \
                  --model=__MODEL_PATH__ \
                  --served-model-name=__SERVED_NAME__ \
                  --tensor-parallel-size=__TP_SIZE__ \
                  --distributed-executor-backend=ray \
                  --max-model-len=__MAX_MODEL_LEN__ \
                  --gpu-memory-utilization=__GPU_MEM_UTIL__ \
                  --enable-auto-tool-choice \
                  --tool-call-parser=beam \
                  --reasoning-parser=beam \
                  --host=0.0.0.0 \
                  --port=8000 \
                  ${EXTRA}
            env:
              - name: RAY_ADDRESS
                value: "127.0.0.1:6379"
              - name: TP_SIZE
                value: "__TP_SIZE__"
              - name: HOME
                value: "/home/ray"
              - name: VLLM_CACHE_ROOT
                value: "/models/.vllm-cache"
              - name: HF_HOME
                value: "/models/.hf-home"
              # Loading 294GB across a TCP-backed TP group is slow, and the
              # NVFP4 path additionally autotunes kernels on first boot. The
              # default engine-ready timeout trips long before that finishes.
              - name: VLLM_ENGINE_READY_TIMEOUT_S
                value: "3600"
              - name: NCCL_IB_DISABLE
                value: "__NCCL_IB_DISABLE__"
              - name: NCCL_SOCKET_IFNAME
                value: "__NCCL_SOCKET_IFNAME__"
              - name: GLOO_SOCKET_IFNAME
                value: "__NCCL_SOCKET_IFNAME__"
            ports:
              - { containerPort: 8000, name: http }
            # Model load here is tens of minutes, not seconds. A startupProbe
            # (not a long readinessProbe) is the right tool: it suppresses the
            # readiness check entirely until vLLM answers, then hands over to a
            # tight readinessProbe that will pull the pod out of the Service
            # promptly if the engine later dies.
            startupProbe:
              httpGet: { path: /health, port: 8000 }
              periodSeconds: 15
              failureThreshold: 320   # 80 minutes
            readinessProbe:
              httpGet: { path: /health, port: 8000 }
              periodSeconds: 10
              failureThreshold: 3
            resources:
              requests:
                cpu: "8"
                memory: 32Gi
              limits:
                memory: 64Gi
            volumeMounts:
              - { name: weights, mountPath: /models }
              - { name: ray-home, mountPath: /home/ray }
              - { name: shm, mountPath: /dev/shm }
        volumes:
          - name: weights
            persistentVolumeClaim:
              claimName: beam-weights
          - name: ray-home
            emptyDir: {}
          - name: shm
            emptyDir:
              medium: Memory
              sizeLimit: 64Gi

  # ---------------------------------------------------------------------------
  # Workers: the remaining TP ranks, one pod per extra GPU node
  # ---------------------------------------------------------------------------
  workerGroupSpecs:
    - groupName: tp-workers
      replicas: __WORKER_REPLICAS__
      minReplicas: __WORKER_REPLICAS__
      maxReplicas: __WORKER_REPLICAS__
      rayStartParams:
        num-gpus: "__WORKER_GPUS__"
      template:
        metadata:
          labels:
            app: beam
        spec:
          tolerations:
            - key: nvidia.com/gpu.product
              operator: Exists
              effect: NoSchedule
          containers:
            # As with the head, index 0 and left command-less so KubeRay can
            # inject `ray start --address=... --block`.
            - name: ray-worker
              image: __IMAGE__
              env:
                # Same reasoning as the head container — these ranks load
                # weights and compile kernels, so they need the identical
                # writable HOME, shared compile cache and NCCL transport
                # settings. Divergence here shows up as half the TP group
                # recompiling, or failing to connect.
                - name: HOME
                  value: "/home/ray"
                - name: VLLM_CACHE_ROOT
                  value: "/models/.vllm-cache"
                - name: HF_HOME
                  value: "/models/.hf-home"
                - name: NCCL_IB_DISABLE
                  value: "__NCCL_IB_DISABLE__"
                - name: NCCL_SOCKET_IFNAME
                  value: "__NCCL_SOCKET_IFNAME__"
                - name: GLOO_SOCKET_IFNAME
                  value: "__NCCL_SOCKET_IFNAME__"
                - name: NCCL_DEBUG
                  value: "WARN"
              resources:
                requests:
                  cpu: "16"
                  memory: 128Gi
                limits:
                  nvidia.com/gpu: "__WORKER_GPUS__"
                  memory: 256Gi
              volumeMounts:
                - { name: weights, mountPath: /models }
                - { name: ray-home, mountPath: /home/ray }
                - { name: shm, mountPath: /dev/shm }
          volumes:
            - name: weights
              persistentVolumeClaim:
                claimName: beam-weights
            - name: ray-home
              emptyDir: {}
            - name: shm
              emptyDir:
                medium: Memory
                sizeLimit: 64Gi
