# Reopen port 8000 on the Ray head pod. Needed on both RHOAI generations.
#
# Something always installs a NetworkPolicy over the head pod: on 2.x it is the
# CodeFlare controller (desiredHeadNetworkPolicy in raycluster_controller.go),
# on 3.x the KubeRay operator's own networkpolicy-controller. Both admit
# roughly:
#
#   * any port, from pods labelled ray.io/cluster=<name>   (the Ray workers)
#   * 10001 and 8265, from any pod in the same namespace
#   * 8265 / 10001, from the KubeRay operator namespace
#   * 8080, from openshift-monitoring
#   * 8443 (+10001 under mTLS), from anywhere
#
# Port 8000 — where our vLLM sidecar serves the OpenAI API — is on neither
# list. Since a pod selected by any NetworkPolicy denies everything not
# explicitly allowed, the OpenShift router (which lives outside the namespace)
# cannot reach vLLM, and the route times out with no useful error anywhere.
# Worse, it fails that way only at the very end, after a 40-minute model load.
#
# NetworkPolicies are additive, so rather than fighting the operator-owned
# policy we add a second one that allows 8000.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: beam-head-vllm
  labels:
    app: beam
spec:
  podSelector:
    matchLabels:
      ray.io/cluster: beam
      ray.io/node-type: head
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - protocol: TCP
          port: 8000
