# ============================================================================
# Single source of truth for a Beam 1.0 serving run, shared by BOTH the
# rhoai2/ and rhoai3/ variants. Edit these values, then run the up.sh of
# whichever variant matches your cluster. Every value can also be overridden
# by an environment variable of the same name (env wins over this file):
#     MAX_MODEL_LEN=65536 ./up.sh
# ============================================================================

# --- Target ---
NAMESPACE=mm-test

# --- Model ---
# Beam 1.0 is a 501B-total / 23.4B-active sparse MoE. Only the NVFP4 checkpoint
# fits this cluster; see README.md for the full sizing table:
#   NVFP4  294GB weights  -> TP8 on H100 (marlin MoE backend)   <- what we use
#   FP8    503GB weights  -> TP8 on H200 only
#   BF16  1003GB weights  -> TP8 on B200/B300 only
MODEL_ID=reflection/Beam-1.0-501B-A23B-NVFP4
SERVED_NAME=beam                 # name clients call in the OpenAI API

# vLLM image. Beam support is NOT in an official vLLM release yet — this tag is
# the build Reflection publishes the recipe against. A generic :latest fails
# with an unrecognized model type. Fully-qualified for OpenShift short-name-mode.
IMAGE=docker.io/vllm/vllm-openai:reflection-beam

# --- Parallelism (Ray) ---
# 294GB of weights do not fit in one 4xH100 node (320GB, before KV cache), so the
# tensor-parallel group spans BOTH GPU nodes via Ray: the head pod contributes
# HEAD_GPUS and each of WORKER_REPLICAS worker pods contributes WORKER_GPUS.
#   TP_SIZE must equal HEAD_GPUS + (WORKER_REPLICAS * WORKER_GPUS).
TP_SIZE=8
HEAD_GPUS=4
WORKER_GPUS=4
WORKER_REPLICAS=1
# Informational for KubeRay (autoscaler compatibility); should track the Ray
# version inside IMAGE. `ray --version` in the image tells you the real one.
RAY_VERSION=2.49.0

# --- Runtime knobs ---
# Beam's context window is 1,048,576 tokens, but KV cache for that is far beyond
# what 8xH100 has left after 294GB of weights. 32k is a comfortable default;
# raise it until vLLM refuses to allocate the KV cache. See README.md.
MAX_MODEL_LEN=32768
GPU_MEM_UTIL=0.92
# MoE kernel backend. NVFP4 on Hopper (H100) MUST use marlin — the Blackwell
# path (flashinfer/cutedsl) has no SM90 kernels. Leave empty to let vLLM pick.
MOE_BACKEND=marlin
# Halves KV-cache memory, which is the binding constraint here.
KV_CACHE_DTYPE=fp8

# --- Hardware / storage ---
# 294GB of weights + the Xet download cache + vLLM's compile cache. The default
# pure-fb-nfsv4 class is RWX, which is what lets head and worker pods (on
# different nodes) mount the same weights at once.
STORAGE_SIZE=400Gi
STORAGE_CLASS=pure-fb-nfsv4

# --- Cross-node collectives ---
# The two GPU nodes have RDMA-capable NICs, but no RDMA device plugin is exposed
# on this cluster, so NCCL falls back to TCP over the pod network. That is the
# single biggest performance cost of this topology (see README.md). Set
# NCCL_IB_DISABLE=0 and provide an RDMA resource if that ever changes.
NCCL_IB_DISABLE=1
NCCL_SOCKET_IFNAME=eth0

# --- Kueue (RHOAI 2.x only) ---
# On RHOAI 2.x, distributed workloads are normally admitted through Kueue. If
# your cluster admin has NOT configured a default local queue, set this to the
# LocalQueue name and the RayCluster gets the kueue.x-k8s.io/queue-name label;
# without it the cluster is created but never admitted, and the pods simply
# never appear. Ignored by the rhoai3 variant.
LOCAL_QUEUE=

# --- Optional HuggingFace token ---
# Only improves download rate limits (Beam is Apache-2.0 and ungated).
# Prefer exporting HF_TOKEN in your shell over writing a real token here.
HF_TOKEN=
