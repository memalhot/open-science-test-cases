# Beam 1.0 served by vLLM with the tensor-parallel group spread across two
# nodes by Ray — RHOAI 2.25 variant.
#
# The topology is identical to ../../rhoai3/yaml/raycluster.yaml (see that file
# and the READMEs for why Ray is needed at all). What differs is everything the
# CodeFlare operator does to a RayCluster on 2.x, which it does NOT do on 3.x:
#
#   1. A mutating webhook injects mTLS into the Ray pods — but only into
#      container index 0. This used to be the main complication here, because
#      vLLM ran as a sidecar at index 1 and needed the RAY_TLS_* env and cert
#      mounts copied by hand. vLLM now runs inside container 0 itself (see the
#      container comment below for why it has to), so the webhook's injection
#      covers it and the hand-written copies are gone.
#   2. The same webhook appends an `oauth-proxy` container (port 8443) to the
#      head and overwrites spec.headGroupSpec.template.spec.serviceAccountName
#      with "<cluster>-oauth-proxy". We deliberately do not set a service
#      account here — the webhook would overwrite it and the validating webhook
#      would then reject the object.
#   3. The CodeFlare controller installs NetworkPolicies on the head and worker
#      pods. The head policy does not permit port 8000 from anywhere, so the
#      router cannot reach vLLM — see networkpolicy.yaml, which reopens it.
#   4. Admission may be gated by Kueue; set LOCAL_QUEUE in config.conf if your
#      cluster has no default LocalQueue.
#
# All of the above is default-on behaviour (mTLSEnabled / rayDashboardOAuthEnabled
# both default to true in the codeflare-operator-config ConfigMap). If your
# cluster admin has turned either off, the extra env/mounts here are harmless:
# Ray ignores RAY_TLS_* when RAY_USE_TLS is unset, and the mounts just resolve
# to volumes the webhook still creates.
apiVersion: ray.io/v1
kind: RayCluster
metadata:
  name: beam
  labels:
    app: beam
    # Kueue admission. Rendered empty when LOCAL_QUEUE is unset, which is
    # correct when the admin has configured a default LocalQueue.
    kueue.x-k8s.io/queue-name: "__LOCAL_QUEUE__"
spec:
  rayVersion: "__RAY_VERSION__"

  # ---------------------------------------------------------------------------
  # Head: Ray GCS + 4 TP ranks + the vLLM API server, all in one container
  # (+ an oauth-proxy container the webhook appends)
  # ---------------------------------------------------------------------------
  headGroupSpec:
    # Empty on purpose. KubeRay only turns rayStartParams into a generated
    # `ray start` when the container has no command of its own, and this head
    # container does (see below) — so anything listed here would be silently
    # ignored. The real flags are in the container's args.
    rayStartParams: {}
    template:
      metadata:
        labels:
          app: beam
      spec:
        tolerations:
          - key: nvidia.com/gpu.product
            operator: Exists
            effect: NoSchedule
        containers:
          # MUST stay at index 0: the CodeFlare webhook injects the mTLS env
          # and cert mounts into this container positionally.
          #
          # This one container runs the Ray head AND the vLLM server.
          #
          # WHY NOT A SEPARATE DRIVER SIDECAR
          # vLLM decides which platform it is on by calling
          # nvmlDeviceGetCount(), so whichever process builds the engine
          # config has to be able to see a GPU. A container with no
          # nvidia.com/gpu allocation does not merely see zero devices — the
          # GPU operator does not mount the NVML library into it at all, and
          # NVIDIA_VISIBLE_DEVICES=all is refused for unprivileged pods. A
          # GPU-less driver sidecar dies at config time with
          #   RuntimeError: Failed to infer device type
          # however little compute it intends to do itself. Serving from the
          # container that already holds the head's GPUs is also the upstream
          # multi-node recipe, and it means the CodeFlare webhook's mTLS
          # injection lands on the serving process for free.
          - name: ray-head
            image: __IMAGE__
            command: ["/bin/sh", "-c"]
            args:
              - |
                set -eu

                # Under CodeFlare mTLS the GCS speaks TLS, and the per-pod
                # server cert is produced by the injected `create-cert` init
                # container into the shared server-cert emptyDir. That init
                # container gates the whole pod, so by the time this runs the
                # files exist — but check rather than fail later inside Ray
                # with an opaque handshake error.
                if [ "${RAY_USE_TLS:-0}" = "1" ]; then
                  echo "mTLS enabled; verifying injected certificates"
                  for f in "$RAY_TLS_SERVER_CERT" "$RAY_TLS_SERVER_KEY" "$RAY_TLS_CA_CERT"; do
                    [ -r "$f" ] || { echo "FATAL: cannot read $f (CodeFlare create-cert init container did not run?)" >&2; exit 1; }
                  done
                  echo "  certificates present"
                fi

                # KubeRay generates `ray start` only for a container with no
                # command, so supplying one means we own the whole invocation.
                # These ports are not free choices: the operator's injected
                # probes poll 52365 and 8265, and the head Service routes
                # 6379/8265/10001 by number.
                ulimit -n 65536
                ray start --head \
                  --port=6379 \
                  --dashboard-host=0.0.0.0 \
                  --dashboard-agent-listen-port=52365 \
                  --metrics-export-port=8080 \
                  --num-cpus=16 \
                  --num-gpus=__HEAD_GPUS__

                # Deliberately no --block: ray start returns once the daemons
                # are up, and vLLM below becomes the container's main process.

                # The worker pod still has to join before the TP group can be
                # formed. Starting vLLM early is not benign — it builds its
                # placement group from whatever is registered at that instant
                # and then blocks forever on ranks that never arrive.
                echo "Waiting for Ray to register __TP_SIZE__ GPUs..."
                python3 - <<'PYWAIT'
                import os, sys, time
                import ray

                want = int(os.environ["TP_SIZE"])
                ray.init(address=os.environ["RAY_ADDRESS"], log_to_driver=False)
                deadline = time.time() + 1800
                have = 0
                while time.time() < deadline:
                    have = int(ray.cluster_resources().get("GPU", 0))
                    if have >= want:
                        print(f"Ray cluster has {have} GPUs; proceeding.", flush=True)
                        sys.exit(0)
                    print(f"  {have}/{want} GPUs registered...", flush=True)
                    time.sleep(10)
                print(f"FATAL: only {have}/{want} GPUs after 30m", file=sys.stderr)
                sys.exit(1)
                PYWAIT

                # Optional flags, omitted entirely when unset in config.conf
                # (an empty `--moe-backend` would be rejected by vLLM).
                EXTRA=""
                if [ -n "__MOE_BACKEND__" ]; then
                  EXTRA="${EXTRA} --moe-backend=__MOE_BACKEND__"
                fi
                if [ -n "__KV_CACHE_DTYPE__" ] && [ "__KV_CACHE_DTYPE__" != "auto" ]; then
                  EXTRA="${EXTRA} --kv-cache-dtype=__KV_CACHE_DTYPE__"
                fi

                echo "Starting vLLM (TP=__TP_SIZE__ over Ray)"
                # shellcheck disable=SC2086
                exec python3 -m vllm.entrypoints.openai.api_server \
                  --model=__MODEL_PATH__ \
                  --served-model-name=__SERVED_NAME__ \
                  --tensor-parallel-size=__TP_SIZE__ \
                  --distributed-executor-backend=ray \
                  --cpu-distributed-timeout-seconds=__DIST_TIMEOUT_S__ \
                  --distributed-timeout-seconds=__DIST_TIMEOUT_S__ \
                  --max-model-len=__MAX_MODEL_LEN__ \
                  --gpu-memory-utilization=__GPU_MEM_UTIL__ \
                  --enable-auto-tool-choice \
                  --tool-call-parser=beam \
                  --reasoning-parser=beam \
                  --host=0.0.0.0 \
                  --port=8000 \
                  ${EXTRA}
            env:
              - name: RAY_ADDRESS
                value: "127.0.0.1:6379"
              - name: TP_SIZE
                value: "__TP_SIZE__"
              # Loading 294GB across a TCP-backed TP group is slow, and the
              # NVFP4 path additionally autotunes kernels on first boot. The
              # default engine-ready timeout trips long before that finishes.
              - name: VLLM_ENGINE_READY_TIMEOUT_S
                value: "3600"
              - name: HOME
                value: "/home/ray"
              - name: VLLM_CACHE_ROOT
                value: "/models/.vllm-cache"
              - name: HF_HOME
                value: "/models/.hf-home"
              - name: NCCL_IB_DISABLE
                value: "__NCCL_IB_DISABLE__"
              - name: NCCL_SOCKET_IFNAME
                value: "__NCCL_SOCKET_IFNAME__"
              - name: GLOO_SOCKET_IFNAME
                value: "__NCCL_SOCKET_IFNAME__"
              - name: NCCL_DEBUG
                value: "WARN"
              # THREAD BUDGET — do not drop these on a many-core node.
              # These GPU nodes have 512 CPUs and the container is capped at
              # ~4096 threads (OpenShift's podPidsLimit; note the container's
              # own cgroup pids.max reads "max", so the ceiling is invisible
              # from inside). Both OpenMP and Ray's gRPC pools size themselves
              # from the host CPU count, and this container hosts the vLLM
              # server plus __HEAD_GPUS__ TP rank actors — at 512 threads per
              # torch process that is thousands of threads before any work
              # happens. Exceeding the cap does not degrade gracefully; the
              # Ray core worker aborts with
              #   Unhandled exception ... thread: Resource temporarily
              #   unavailable [system:11]
              # which looks like a Ray bug rather than a limit.
              - name: OMP_NUM_THREADS
                value: "8"
              - name: RAY_num_server_call_thread
                value: "8"
              # PyTorch symmetric memory assumes every rank can reach the
              # others over NVLink/P2P, which is false for a TP group split
              # across two nodes. vLLM's SymmMemCommunicator checks device
              # capability and world size but NOT node count (unlike
              # CustomAllreduce and FlashInferAllReduce, which self-disable on
              # multi-node), so at TP=8 on H100 it calls
              # torch_symm_mem.rendezvous() and never returns. The hang raises
              # nothing, so it surfaces as whichever timeout is shortest.
              # Must match the worker container below.
              - name: VLLM_ALLREDUCE_USE_SYMM_MEM
                value: "0"
              # RAY_USE_TLS / RAY_TLS_* and the ca-vol + server-cert mounts are
              # injected here by the CodeFlare webhook. Not repeated by hand:
              # its validating webhook treats them as immutable and rejects a
              # spec that already carries conflicting values.
            ports:
              - { containerPort: 6379,  name: gcs }
              - { containerPort: 8265,  name: dashboard }
              - { containerPort: 10001, name: client }
              - { containerPort: 8000,  name: http }
            # Model load here is tens of minutes, not seconds. A startupProbe
            # is the right tool: until it passes, kubelet suppresses both the
            # readiness probe below AND the liveness probe KubeRay injects, so
            # a slow load cannot be mistaken for a hung raylet and restarted.
            # Once it passes, Ready on this pod means "serving".
            startupProbe:
              httpGet: { path: /health, port: 8000 }
              periodSeconds: 15
              failureThreshold: 320   # 80 minutes
            readinessProbe:
              httpGet: { path: /health, port: 8000 }
              periodSeconds: 10
              failureThreshold: 3
            # No livenessProbe: KubeRay injects a raylet + GCS healthz one,
            # which is the right liveness signal for this container now that
            # readiness tracks vLLM instead.
            resources:
              # The head's old two containers asked for 16+8 CPU and
              # 128+32Gi / 256+64Gi; keep the pod's totals the same so this
              # still schedules exactly where it used to.
              requests:
                cpu: "24"
                memory: 160Gi
              limits:
                nvidia.com/gpu: "__HEAD_GPUS__"
                memory: 320Gi
            volumeMounts:
              - { name: weights, mountPath: /models }
              - { name: ray-home, mountPath: /home/ray }
              - { name: shm, mountPath: /dev/shm }
              - { name: ray-tmp, mountPath: /tmp/ray }
              # ca-vol and server-cert are appended here by the CodeFlare
              # webhook along with the RAY_TLS_* env, since this is container
              # 0. Not declared by hand: its validating webhook treats them as
              # immutable and rejects a spec carrying conflicting values.
        volumes:
          - name: weights
            persistentVolumeClaim:
              claimName: beam-weights
          - name: ray-home
            emptyDir: {}
          - name: shm
            emptyDir:
              medium: Memory
              sizeLimit: 64Gi
          # Ray's session directory: logs, the session state and any object
          # spill. On an emptyDir rather than the container's writable layer,
          # which is backed by the node's root filesystem and much smaller.
          - name: ray-tmp
            emptyDir: {}
          # ca-vol / server-cert / proxy-tls-secret are appended by the
          # CodeFlare webhook; declaring them here would duplicate what it
          # adds and trip its immutability validation.

  # ---------------------------------------------------------------------------
  # Workers: the remaining TP ranks, one pod per extra GPU node
  # ---------------------------------------------------------------------------
  workerGroupSpecs:
    - groupName: tp-workers
      replicas: __WORKER_REPLICAS__
      minReplicas: __WORKER_REPLICAS__
      maxReplicas: __WORKER_REPLICAS__
      rayStartParams:
        num-gpus: "__WORKER_GPUS__"
      template:
        metadata:
          labels:
            app: beam
        spec:
          tolerations:
            - key: nvidia.com/gpu.product
              operator: Exists
              effect: NoSchedule
          containers:
            # Index 0 again — the worker group has no sidecar, so the webhook's
            # mTLS injection lands on the right container unaided.
            - name: ray-worker
              image: __IMAGE__
              env:
                - name: HOME
                  value: "/home/ray"
                - name: VLLM_CACHE_ROOT
                  value: "/models/.vllm-cache"
                - name: HF_HOME
                  value: "/models/.hf-home"
                - name: NCCL_IB_DISABLE
                  value: "__NCCL_IB_DISABLE__"
                - name: NCCL_SOCKET_IFNAME
                  value: "__NCCL_SOCKET_IFNAME__"
                - name: GLOO_SOCKET_IFNAME
                  value: "__NCCL_SOCKET_IFNAME__"
                - name: NCCL_DEBUG
                  value: "WARN"
                # Same reasoning as the head — see its comments. The ranks on
                # this node share the same thread ceiling and take part in the
                # same rendezvous, so leaving either setting off here alone
                # reproduces the failure exactly.
                - name: OMP_NUM_THREADS
                  value: "8"
                - name: RAY_num_server_call_thread
                  value: "8"
                - name: VLLM_ALLREDUCE_USE_SYMM_MEM
                  value: "0"
              resources:
                requests:
                  cpu: "16"
                  memory: 128Gi
                limits:
                  nvidia.com/gpu: "__WORKER_GPUS__"
                  memory: 256Gi
              volumeMounts:
                - { name: weights, mountPath: /models }
                - { name: ray-home, mountPath: /home/ray }
                - { name: shm, mountPath: /dev/shm }
          volumes:
            - name: weights
              persistentVolumeClaim:
                claimName: beam-weights
            - name: ray-home
              emptyDir: {}
            - name: shm
              emptyDir:
                medium: Memory
                sizeLimit: 64Gi
